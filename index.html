<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="발효밥상 카드" />
  <meta name="theme-color" content="#FAF8F4" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>정인숙 자연 발효 밥상 · 커리큘럼 카드</title>
  <style>
    :root {
      --bg: #FAF8F4;
      --card: #FFFFFF;
      --text: #1F2421;
      --muted: #6B726D;
      --border: #EAE6DD;
      --accent: #2E6F40;
      --accent-soft: #E8F5EC;
      --lock-bg: #FEF3C7;
      --lock-text: #92400E;
      --shadow: 0 2px 10px rgba(31, 36, 33, 0.05);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.45;
      padding-bottom: 48px;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 16px 32px;
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }
    .btn-ghost {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }
    .btn-ghost:active { transform: scale(0.97); }
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 38px 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      font-size: 15px;
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow);
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #EFECE4;
      color: var(--muted);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      display: none;
    }
    .overall-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .overall-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }
    .progress-track {
      height: 8px;
      background: #EFECE4;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .stage {
      margin-bottom: 22px;
    }
    .stage-title {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 2px;
      letter-spacing: -0.01em;
    }
    .stage-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .course-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .course-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.12s ease;
    }
    .course-card:active { transform: scale(0.985); }
    .course-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .course-info {
      flex: 1;
      min-width: 0;
    }
    .course-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .course-name {
      font-size: 15.5px;
      font-weight: 700;
    }
    .course-desc {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .course-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .count-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: #F3F1EA;
      color: var(--muted);
    }
    .count-pill.done {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .chev {
      font-size: 18px;
      color: #A3A8A4;
    }
    .badge-member {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--lock-bg);
      color: var(--lock-text);
    }
    /* Detail View */
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tabs {
      display: flex;
      gap: 6px;
    }
    .tab {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .jump-banner {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .video-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .video-card {
      display: flex;
      align-items: center;
      gap: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .video-card.watched {
      opacity: 0.72;
      background: #F7F6F2;
    }
    .thumb-wrap {
      position: relative;
      width: 112px;
      height: 63px;
      border-radius: 9px;
      overflow: hidden;
      background: #E5E2D9;
      flex-shrink: 0;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .dur-badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .lock-overlay {
      position: absolute;
      left: 4px;
      top: 4px;
      background: rgba(146, 64, 14, 0.92);
      color: #FEF3C7;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .video-body {
      flex: 1;
      min-width: 0;
    }
    .video-num {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .video-title {
      font-size: 13.8px;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .check-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid #D1CCC0;
      background: #fff;
      color: transparent;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .check-btn.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .pwa-box {
      margin-top: 26px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    .pwa-box strong { color: var(--text); }
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.62);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.3);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
    }
    .player-ratio {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }
    .player-ratio iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .modal-body {
      padding: 14px 16px 18px;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .member-note {
      background: var(--lock-bg);
      color: var(--lock-text);
      font-size: 12.5px;
      padding: 9px 11px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-primary {
      flex: 1;
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-secondary {
      border: 1px solid var(--border);
      background: #F6F4EE;
      color: var(--text);
      border-radius: 11px;
      padding: 11px 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; }
    .empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <!-- Player Modal -->
  <div class="modal-backdrop" id="playerModal">
    <div class="modal">
      <div class="player-ratio" id="playerContainer"></div>
      <div class="modal-body" id="playerBody"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <div class="modal-body">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h2 style="margin:0;font-size:18px;">⚙ 커리큘럼 설정</h2>
          <button class="btn-ghost" onclick="closeSettings()">닫기</button>
        </div>
        <div class="setting-row">
          <div>
            <div style="font-weight:700;font-size:14.5px;">🔒 멤버십 전용 영상 보이기</div>
            <div style="font-size:12.5px;color:var(--muted);">끄면 멤버십 잠금 영상과 코스를 화면에서 숨겨요</div>
          </div>
          <input type="checkbox" id="toggleMember" style="width:20px;height:20px;accent-color:var(--accent);" />
        </div>
        <div class="setting-row">
          <div>
            <div style="font-weight:700;font-size:14.5px;">시청 기록 초기화</div>
            <div style="font-size:12.5px;color:var(--muted);">이 기기에 저장된 시청 완료 체크를 모두 지워요</div>
          </div>
          <button class="btn-secondary" style="color:#B91C1C;" onclick="resetProgress()">초기화</button>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const DATA = window.CURRICULUM_DATA;
    const STORAGE_WATCHED = 'ferment_watched_v1';
    const STORAGE_SETTINGS = 'ferment_settings_v1';

    let watched = new Set(JSON.parse(localStorage.getItem(STORAGE_WATCHED) || '[]'));
    let settings = Object.assign({ showMember: true }, JSON.parse(localStorage.getItem(STORAGE_SETTINGS) || '{}'));

    let state = {
      view: 'home', // 'home' | 'course'
      courseId: null,
      filter: 'all', // 'all' | 'todo' | 'done'
      jumpMode: false,
      query: ''
    };

    const allCourses = DATA.stages.flatMap(s => s.courses);
    const courseById = Object.fromEntries(allCourses.map(c => [c.id, c]));

    function saveWatched() {
      localStorage.setItem(STORAGE_WATCHED, JSON.stringify([...watched]));
    }
    function saveSettings() {
      localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings));
    }

    function visibleVideos(course) {
      return settings.showMember ? course.videos : course.videos.filter(v => !v.m);
    }

    function toggleWatch(vid, e) {
      if (e) e.stopPropagation();
      if (watched.has(vid)) watched.delete(vid);
      else watched.add(vid);
      saveWatched();
      render();
    }

    function markUpToHere(course, idx) {
      const vids = visibleVideos(course);
      for (let i = 0; i <= idx; i++) watched.add(vids[i].id);
      saveWatched();
      state.jumpMode = false;
      render();
    }

    function openCourse(id) {
      state.view = 'course';
      state.courseId = id;
      state.filter = 'all';
      state.jumpMode = false;
      window.scrollTo(0, 0);
      render();
    }

    function goHome() {
      state.view = 'home';
      state.courseId = null;
      window.scrollTo(0, 0);
      render();
    }

    function openPlayer(vid, courseId) {
      const course = courseId ? courseById[courseId] : null;
      const list = course ? visibleVideos(course) : allCourses.flatMap(c => visibleVideos(c));
      const idx = list.findIndex(v => v.id === vid);
      const video = list[idx] || allCourses.flatMap(c => c.videos).find(v => v.id === vid);
      if (!video) return;

      const prev = idx > 0 ? list[idx - 1] : null;
      const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
      const isWatched = watched.has(vid);

      document.getElementById('playerContainer').innerHTML =
        `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;

      document.getElementById('playerBody').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-size:12px;color:var(--muted);font-weight:700;">
            ${course ? `${course.emoji} ${course.name} · ${video.n}편` : ''} ${video.d ? `· ${video.d}` : ''}
          </span>
          <button class="btn-ghost" onclick="closePlayer()">닫기 ✕</button>
        </div>
        <h3 class="modal-title">${video.m ? '<span class="badge-member">🔒 멤버십 전용</span> ' : ''}${escapeHtml(video.t)}</h3>
        ${video.m ? `<div class="member-note">🔒 이 영상은 채널 <strong>멤버십 전용</strong>이에요. 아래 'YouTube에서 열기'를 누르면 가입 계정으로 바로 재생돼요.</div>` : ''}
        <div class="modal-actions">
          <button class="btn-primary" onclick="toggleWatchInModal('${vid}', '${courseId || ''}')">
            ${isWatched ? '✓ 시청 완료됨 (취소)' : '✓ 다 봤어요 체크'}
          </button>
          <a class="btn-secondary" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">▶ YouTube에서 열기</a>
        </div>
        ${(prev || next) ? `
          <div style="display:flex;gap:8px;margin-top:8px;">
            ${prev ? `<button class="btn-secondary" style="flex:1;" onclick="openPlayer('${prev.id}','${courseId}')">← 이전 편</button>` : '<div style="flex:1"></div>'}
            ${next ? `<button class="btn-secondary" style="flex:1;" onclick="openPlayer('${next.id}','${courseId}')">다음 편 →</button>` : '<div style="flex:1"></div>'}
          </div>` : ''}
      `;
      document.getElementById('playerModal').classList.add('open');
    }

    function toggleWatchInModal(vid, courseId) {
      toggleWatch(vid);
      openPlayer(vid, courseId);
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.remove('open');
      document.getElementById('playerContainer').innerHTML = '';
    }

    function openSettings() {
      document.getElementById('toggleMember').checked = settings.showMember;
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function resetProgress() {
      if (confirm('시청 완료 체크를 모두 초기화할까요?')) {
        watched.clear();
        saveWatched();
        closeSettings();
        render();
      }
    }

    document.getElementById('toggleMember').addEventListener('change', (e) => {
      settings.showMember = e.target.checked;
      saveSettings();
      render();
    });
    document.getElementById('playerModal').addEventListener('click', (e) => {
      if (e.target.id === 'playerModal') closePlayer();
    });
    document.getElementById('settingsModal').addEventListener('click', (e) => {
      if (e.target.id === 'settingsModal') closeSettings();
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    function renderVideoCard(v, courseId, idxInList, courseObj) {
      const isDone = watched.has(v.id);
      const clickHandler = state.jumpMode && courseObj
        ? `markUpToHere(courseById['${courseId}'], ${idxInList})`
        : `openPlayer('${v.id}', '${courseId}')`;

      return `
        <div class="video-card ${isDone ? 'watched' : ''}" onclick="${clickHandler}">
          <div class="thumb-wrap">
            <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" loading="lazy" alt="" />
            ${v.d ? `<span class="dur-badge">${v.d}</span>` : ''}
            ${v.m ? `<span class="lock-overlay">🔒 멤버십</span>` : ''}
          </div>
          <div class="video-body">
            <div class="video-num">
              <span>${v.n}편</span>
              ${v.m ? `<span class="badge-member">🔒 멤버십 전용</span>` : ''}
            </div>
            <div class="video-title">${escapeHtml(v.t)}</div>
          </div>
          ${!state.jumpMode ? `
            <button class="check-btn ${isDone ? 'checked' : ''}" title="시청 완료" onclick="toggleWatch('${v.id}', event)">✓</button>
          ` : `<span style="font-size:12px;font-weight:700;color:#B45309;white-space:nowrap;">여기까지 ✓</span>`}
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (state.view === 'home') {
        const visibleCourses = allCourses.filter(c => settings.showMember || !c.membershipCourse);
        const totalVids = visibleCourses.reduce((acc, c) => acc + visibleVideos(c).length, 0);
        const doneVids = visibleCourses.reduce((acc, c) => acc + visibleVideos(c).filter(v => watched.has(v.id)).length, 0);
        const pct = totalVids ? Math.round((doneVids / totalVids) * 100) : 0;

        const q = state.query.trim().toLowerCase();
        let searchHtml = '';
        if (q) {
          const hits = [];
          visibleCourses.forEach(c => {
            visibleVideos(c).forEach(v => {
              if (v.t.toLowerCase().includes(q)) hits.push({ v, c });
            });
          });
          searchHtml = `
            <div style="margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:600;">
              "${escapeHtml(state.query)}" 검색 결과 ${hits.length}편
            </div>
            <div class="video-list">
              ${hits.slice(0, 60).map(h => renderVideoCard(h.v, h.c.id, 0, null)).join('') || '<div class="empty">일치하는 영상이 없어요.</div>'}
            </div>
          `;
        }

        app.innerHTML = `
          <header>
            <div>
              <h1>🥬 정인숙 자연 발효 밥상</h1>
              <div class="sub">발효 커리큘럼 카드 · 총 ${totalVids}편</div>
            </div>
            <button class="btn-ghost" onclick="openSettings()">⚙ 설정</button>
          </header>

          <div class="search-box">
            <input id="searchInput" type="search" placeholder="레시피·재료 검색 (예: 쌀누룩, 낫토, 식혜, 김치)" value="${escapeHtml(state.query)}" />
            <button class="search-clear" id="searchClear" style="display:${state.query ? 'block' : 'none'};" onclick="clearSearch()">✕</button>
          </div>

          ${q ? searchHtml : `
            <div class="overall-bar">
              <div class="overall-top">
                <span>전체 커리큘럼 진도</span>
                <span style="color:var(--accent);">${doneVids} / ${totalVids}편 (${pct}%)</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>

            ${DATA.stages.map(st => {
              const courses = st.courses.filter(c => settings.showMember || !c.membershipCourse);
              if (!courses.length) return '';
              return `
                <section class="stage">
                  <h2 class="stage-title">${st.stage}</h2>
                  <p class="stage-sub">${st.subtitle}</p>
                  <div class="course-list">
                    ${courses.map(c => {
                      const vids = visibleVideos(c);
                      const done = vids.filter(v => watched.has(v.id)).length;
                      const allDone = vids.length > 0 && done === vids.length;
                      return `
                        <div class="course-card" onclick="openCourse('${c.id}')">
                          <div class="course-icon" style="background:${c.color};">${c.emoji}</div>
                          <div class="course-info">
                            <div class="course-name-row">
                              <span class="course-name">${c.name}</span>
                              ${c.membershipCourse ? `<span class="badge-member">🔒 멤버십 전용</span>` : ''}
                            </div>
                            <div class="course-desc">${c.desc}</div>
                          </div>
                          <div class="course-meta">
                            <span class="count-pill ${allDone ? 'done' : ''}">${done}/${vids.length}편</span>
                            <span class="chev">›</span>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </section>
              `;
            }).join('')}

            <div class="pwa-box">
              <strong>📲 홈 화면에 추가하면 앱처럼 열려요</strong><br/>
              아이폰 사파리 아래 <strong>공유 버튼 ⬆︎ → 홈 화면에 추가</strong>를 누르면 앱처럼 바로 열리고, 시청 기록도 이 폰에 계속 저장돼요.
            </div>
          `}
        `;

        const input = document.getElementById('searchInput');
        if (input) {
          input.addEventListener('input', (e) => {
            state.query = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const nextInput = document.getElementById('searchInput');
            if (nextInput) { nextInput.focus(); nextInput.setSelectionRange(pos, pos); }
          });
        }
      } else {
        const course = courseById[state.courseId];
        if (!course) { goHome(); return; }
        const vids = visibleVideos(course);
        const doneCount = vids.filter(v => watched.has(v.id)).length;
        const pct = vids.length ? Math.round((doneCount / vids.length) * 100) : 0;

        let filtered = vids.map((v, i) => ({ v, i }));
        if (state.filter === 'todo') filtered = filtered.filter(x => !watched.has(x.v.id));
        if (state.filter === 'done') filtered = filtered.filter(x => watched.has(x.v.id));

        app.innerHTML = `
          <div class="detail-head">
            <button class="btn-ghost" onclick="goHome()">← 전체 커리큘럼</button>
            <button class="btn-ghost" onclick="openSettings()">⚙ 설정</button>
          </div>

          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <div class="course-icon" style="background:${course.color};">${course.emoji}</div>
            <div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <h1 style="font-size:20px;">${course.name}</h1>
                ${course.membershipCourse ? `<span class="badge-member">🔒 멤버십 전용</span>` : ''}
              </div>
              <div class="sub">${course.desc} · ${doneCount} / ${vids.length}편 완료 (${pct}%)</div>
            </div>
          </div>

          <div class="progress-track" style="margin-bottom:14px;"><div class="progress-fill" style="width:${pct}%"></div></div>

          <div class="toolbar">
            <div class="tabs">
              <button class="tab ${state.filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">전체 ${vids.length}</button>
              <button class="tab ${state.filter === 'todo' ? 'active' : ''}" onclick="setFilter('todo')">안 본 편 ${vids.length - doneCount}</button>
              <button class="tab ${state.filter === 'done' ? 'active' : ''}" onclick="setFilter('done')">완료 ${doneCount}</button>
            </div>
            <button class="btn-ghost" onclick="toggleJumpMode()">${state.jumpMode ? '취소' : '📦 어디까지 봤나요?'}</button>
          </div>

          ${state.jumpMode ? `
            <div class="jump-banner">
              <span>이미 본 편을 누르면 <strong>그 앞 편까지 한 번에 완료 체크</strong>돼요.</span>
            </div>
          ` : ''}

          <div class="video-list">
            ${filtered.map(x => renderVideoCard(x.v, course.id, x.i, course)).join('') || '<div class="empty">해당하는 영상이 없어요.</div>'}
          </div>
        `;
      }
    }

    function setFilter(f) { state.filter = f; render(); }
    function toggleJumpMode() { state.jumpMode = !state.jumpMode; render(); }
    function clearSearch() { state.query = ''; render(); }

    render();
  </script>
</body>
</html>
